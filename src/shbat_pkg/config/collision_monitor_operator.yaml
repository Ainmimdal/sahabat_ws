collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_muxed
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: [0.35, 0.35, 0.35, -0.35, -0.35, -0.35, -0.35, 0.35]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /operator/collision_stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
