### Laser Scan Filter Configuration
### 
### RPLIDAR S2: upside-down, forward 7cm from base_link.
### lidar_link TF: rpy="3.14 0 3.14" (roll=π fixes mirror, yaw=π fixes front/back).
### 
### Lidar frame angle mapping after TF:
###   0° = robot rear, 90° = robot left, ±180° = robot front, -90° = robot right
###
### 180° front-only FOV: blocks rear half [-90°, 90°]

scan_filter:
  ros__parameters:
    # Input/output topics
    input_topic: "/scan_raw"
    output_topic: "/scan"
    
    # Range filters - IMPORTANT for noise reduction
    min_range: 0.10      # 10cm - ignore very close readings (robot body + noise)
    max_range: 8.0       # 8m - reduced from 12m, far readings are noisy
    
    # Filter zones: block rear 180° (-90° to 90°) to see front half only
    filter_zones: [-90.0, 90.0]
