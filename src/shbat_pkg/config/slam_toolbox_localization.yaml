# slam_toolbox localization configuration for Sahabat Robot
# Use this when localizing within a saved map (no new mapping)

slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true
    
    # Mode: localization (use saved map, don't create new one)
    mode: localization
    
    # Enable RViz 2D Pose Estimate to set initial pose
    use_lifecycle_manager: false
    
    # Start pose (will be overridden by initial pose if set)
    map_start_at_dock: true

    # Timing. Keep TF publishing responsive enough for Nav2 without overloading
    # the Orin Nano or reacting to every tiny scan-matching fluctuation.
    transform_publish_period: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    throttle_scans: 1
    minimum_time_interval: 0.1
    map_update_interval: 1.0
    
    # Resolution (should match the saved map)
    resolution: 0.05
    max_laser_range: 8.0
    laser_min_range: 0.15
    laser_max_range: 8.0
    
    # Scan matching. These are close to the proven mapping settings but keep
    # loop closure disabled so localization does not reshape the saved map.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    scan_buffer_size: 5
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    
    # No loop closing in localization mode
    do_loop_closing: false

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Scan matcher parameters
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.8

    fine_search_angle_offset: 0.00523
    coarse_search_angle_offset: 0.524
    coarse_angle_resolution: 0.0262
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.4
    use_response_expansion: true
    enable_interactive_mode: true

    # State
    debug_logging: false
    stack_size_to_use: 40000000
