### Nav2 Configuration for Odom-Only Navigation (No Map, No AMCL)
### 
### Use Case: Testing navigation with wheel odometry + IMU + LIDAR
### - No pre-built map required
### - Uses odom frame for both local and global planning
### - LIDAR for obstacle detection
### - EKF provides odom->base_link transform
### - Static map->odom transform (identity)
###
### This is Phase 1 testing before adding map-based localization.

# No AMCL needed - we use static map->odom transform

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map            # CHANGED: use map frame for localization
    robot_base_frame: base_link
    odom_topic: /odom            # EKF filtered odometry
    bt_loop_duration: 10
    # Retain the later Jetson service-timeout fix; this is independent of the
    # planner and prevents false recovery activation under load.
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    transform_tolerance: 1.0
    # Nav2 default behavior trees - NOT setting these params uses the package defaults
    # The defaults are defined in the bt_navigator source code
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5   # No lateral movement (diff drive)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom

    progress_checker:
      # A behind-goal maneuver initially makes angular, not linear, progress.
      # SimpleProgressChecker ignored rotation and aborted the controller after
      # 20 seconds even while the robot was turning correctly.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.20
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True               # Once in tolerance, stay "reached" even if drifts slightly
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10      # Avoid repeated corrections inside localization noise
      yaw_goal_tolerance: 0.12     # ~7 degrees avoids final-heading hunting

    FollowPath:
      # The rotation shim pivots in place whenever a new path starts more than
      # angular_dist_threshold away from the robot's heading, then hands the
      # path to DWB. DWB alone stalled on side/behind goals: with 0.5 rad/s and
      # a 1.2 s horizon, in-place rotation barely changed its critic scores, so
      # it hovered near stiction until the 20 s progress checker aborted.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.6      # ~34 deg; smaller errors stay DWB arcs
      # This Humble build has no braking profile: the shim turns at full rate
      # until it disengages, then the ZLAC 500 ms decel ramp coasts the robot
      # ~0.12 rad at 0.5 rad/s. Disengaging at that angle lets it coast into
      # alignment. The 2026-10-05 bag at 0.25 rad handed DWB 10-14 deg of
      # error while still turning, and DWB then weaved +/-20 deg.
      angular_disengage_threshold: 0.12  # ~7 deg, matches the coast angle
      forward_sampling_distance: 0.5   # Aim at the path 0.5 m ahead
      rotate_to_heading_angular_vel: 0.5  # The validated lidar-safe cap
      # Only shapes the start of a pivot here (no braking in this build).
      max_angular_accel: 3.0           # Same stiction-breaking ramp as DWB
      # Ramp from the last command, not measured speed; measured speed stays
      # ~0 below drivetrain stiction and would hold the command there.
      closed_loop: false
      simulate_ahead_time: 1.0         # Collision-check the pivot
      rotate_to_goal_heading: false    # DWB RotateToGoal keeps final heading
      # DWB parameters below are read by the primary controller in this same
      # FollowPath namespace. DWB scores complete velocity trajectories; its
      # RotateToGoal critic slows, stops, then minimizes final-yaw error.
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4               # Enough to cross the carpet transition
      max_vel_y: 0.0               # Differential drive cannot move laterally
      max_vel_theta: 0.5           # Lidar-safe limit for the 10 Hz scan rate
      min_speed_xy: 0.01
      max_speed_xy: 0.4
      # Commands below ~0.056 rad/s truncate to 0 RPM in the integer motor
      # interface, and 0.10 rad/s still becomes only 1 RPM. Use ~2 RPM so
      # side/behind-goal turns reliably overcome drivetrain stiction.
      min_speed_theta: 0.15
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 3.0           # First 20 Hz sample can overcome drivetrain stiction
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -3.0        # Command braking early; motor still ramps over 500 ms
      # Keep the trajectory search small enough for the Jetson to sustain the
      # 20 Hz controller deadline. The former 20 x 40 grid evaluated 819 valid
      # trajectories per cycle and repeatedly missed the deadline.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.2                # Still spans the measured drivetrain response delay
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      publish_evaluation: false
      publish_global_plan: false
      publish_transformed_plan: false
      publish_local_plan: false
      publish_trajectories: false
      publish_cost_grid_pc: false
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      # Prefer a lower linear velocity once inside the final XY goal window.
      RotateToGoal.slowing_factor: 8.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 4                     # 4m x 4m local costmap
      height: 4
      resolution: 0.05             # 5cm resolution
      robot_radius: 0.25           # 25cm robot radius
      plugins: ["voxel_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False   # Set True for debugging
        origin_z: 0.0
        z_resolution: 0.1          # 10cm vertical resolution
        z_voxels: 10               # 10 voxels = 1m height
        max_obstacle_height: 1.0   # Obstacles up to 1m
        min_obstacle_height: 0.05  # Ignore ground (below 5cm)
        mark_threshold: 0          # Mark cell as obstacle if any point hits
        unknown_threshold: 15
        observation_sources: scan
        
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.15
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35     # 35cm inflation
        
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true          # Follow robot, no static map
      width: 20                     # 20m rolling window for planning
      height: 20
      resolution: 0.05
      robot_radius: 0.25
      track_unknown_space: false    # No map = all is free space initially
      transform_tolerance: 1.0
      plugins: ["voxel_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 10
        max_obstacle_height: 1.0
        min_obstacle_height: 0.05
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: scan
        
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.15
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
        
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    transform_tolerance: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true          # Allow planning through unknown space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: false           # Behavior tree calls smoother_server once

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom             # Use odom frame
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: True
    # Accumulate the ramp from the previously published command. CLOSED_LOOP
    # repeatedly resets to zero below drivetrain stiction and cannot start.
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.5]      # Conservative linear and lidar-safe turn caps
    min_velocity: [-0.3, 0.0, -0.5]    # Reverse remains limited to recovery behavior
    max_accel: [0.6, 0.0, 3.0]         # Let DWB select turn speed without a second slow ramp
    # Request prompt angular braking when DWB reduces its command. The motor retains
    # its smooth 500 ms normal ramp; E-stop remains a separate 10 ms quick stop.
    max_decel: [-0.35, 0.0, -3.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 2000    # 2 seconds at each waypoint
